<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="description" content="用正體中文搜尋、預覽並複製 Iconify 開源圖示。" />
    <title>找圖示｜Iconify 正體中文搜尋</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="找圖示首頁">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>找圖示</span>
        </a>
        <a class="source-link" href="https://iconify.design/" target="_blank" rel="noreferrer">由 Iconify 提供資料 ↗</a>
      </header>

      <section class="hero">
        <p class="eyebrow">OPEN SOURCE ICON FINDER</p>
        <h1>找到一個，<em>剛剛好</em>的圖示。</h1>
        <p class="intro">搜尋超過 30 萬個開源圖示，複製到你的網站或產品裡。</p>
        <form class="search-form" id="search-form" role="search">
          <label class="sr-only" for="search-input">搜尋圖示</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search-input" name="q" type="search" autocomplete="off" placeholder="搜尋圖示，例如：home、arrow、cloud" />
          <button type="submit">搜尋</button>
        </form>
        <div class="quick-searches" aria-label="熱門搜尋">
          <span>試試：</span>
          <button type="button" data-query="home">home</button>
          <button type="button" data-query="arrow">arrow</button>
          <button type="button" data-query="heart">heart</button>
          <button type="button" data-query="github">github</button>
        </div>
      </section>

      <section class="workspace" aria-live="polite">
        <div class="results-heading">
          <div>
            <p class="section-kicker" id="results-kicker">推薦圖示</p>
            <h2 id="results-title">從一個關鍵字開始</h2>
          </div>
          <span class="result-count" id="result-count"></span>
        </div>
        <div class="status" id="status"></div>
        <div class="results-grid" id="results-grid"></div>
      </section>

      <footer class="footer">
        <span>Iconify 圖示各自受不同授權條款約束。</span>
        <a href="https://github.com/iconify/icon-sets/blob/master/collections.md" target="_blank" rel="noreferrer">查看來源與授權 ↗</a>
      </footer>
    </main>

    <dialog id="icon-dialog" class="icon-dialog">
      <button class="dialog-close" id="dialog-close" type="button" aria-label="關閉">×</button>
      <div id="dialog-content"></div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
